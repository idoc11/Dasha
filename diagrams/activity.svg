,520 L290,520 L290,540" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><rect x="125.0" y="604.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="290" y="640.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Задать параметры нагрузки</text><path d="M290,580 L290,604" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><rect x="125.0" y="699.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="290" y="726.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Нажать «Запустить</text><text x="290" y="744.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">симуляцию»</text><path d="M290,666 L290,699" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><rect x="715.0" y="699.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="880" y="735.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Проверить параметры</text><path d="M455.0,730 L715.0,730" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><polygon points="880,795.0 1020.0,840 880,885.0 740.0,840" fill="#fff" stroke="#000" stroke-width="2"/><text x="880" y="836.5" font-family="DejaVu Sans" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Параметры</text><text x="880" y="853.3" font-family="DejaVu Sans" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">допустимы?</text><path d="M880,761 L880,795" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><rect x="1070.0" y="809.0" width="280" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="1210" y="836.5" font-family="DejaVu Sans" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Вывести сообщение</text><text x="1210" y="853.3" font-family="DejaVu Sans" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">об ошибке параметров</text><path d="M1020,840 L1070.0,840" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><text x="1045" y="821.9" font-family="DejaVu Sans" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">[нет]</text><path d="M1210,809.0 L1210,560 L310,560" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><rect x="715.0" y="924.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="880" y="951.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Промоделировать заданное</text><text x="880" y="969.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">число дней и усреднить</text><path d="M880,885 L880,924" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><text x="910" y="908.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">[да]</text><rect x="715.0" y="1019.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="880" y="1046.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Показать вердикт, отчёт,</text><text x="880" y="1064.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">таблицу и графики</text><path d="M880,986 L880,1019" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><rect x="715.0" y="1114.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="880" y="1141.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Записать расчёт</text><text x="880" y="1159.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">в историю (БД)</text><path d="M880,1081 L880,1114" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><polygon points="290,1205.0 440.0,1250 290,1295.0 140.0,1250" fill="#fff" stroke="#000" stroke-width="2"/><text x="290" y="1246.5" font-family="DejaVu Sans" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Норматив</text><text x="290" y="1263.3" font-family="DejaVu Sans" font-size="14" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">выполняется?</text><path d="M880,1176 L880,1195 L290,1195 L290,1205" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><rect x="125.0" y="1334.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="290" y="1361.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Нажать «Подобрать число</text><text x="290" y="1379.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">окон под норматив»</text><path d="M290,1295 L290,1334" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><text x="322" y="1318.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">[нет]</text><rect x="715.0" y="1334.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="880" y="1361.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Найти минимальное число</text><text x="880" y="1379.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">окон делением пополам</text><path d="M455.0,1365 L715.0,1365" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><rect x="715.0" y="1429.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="880" y="1456.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Подставить число окон</text><text x="880" y="1474.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">и повторить расчёт</text><path d="M880,1396 L880,1429" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><polygon points="290,1500.0 310.0,1520 290,1540.0 270.0,1520" fill="#fff" stroke="#000" stroke-width="2"/><path d="M880,1491 L880,1520 L310,1520" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><path d="M140,1250 L60,1250 L60,1520 L270,1520" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><text x="100" y="1237.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">[да]</text><rect x="125.0" y="1554.0" width="330" height="62" rx="16" fill="#fff" stroke="#000" stroke-width="2"/><text x="290" y="1581.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Сохранить отчёт (CSV)</text><text x="290" y="1599.25" font-family="DejaVu Sans" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">или сценарий</text><path d="M290,1540 L290,1554" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/><circle cx="290" cy="1670" r="18" fill="#fff" stroke="#000" stroke-width="2.5"/><circle cx="290" cy="1670" r="10" fill="#000"/><path d="M290,1616 L290,1650" fill="none" stroke="#000" stroke-width="2" marker-end="url(#fill)"/></svg>